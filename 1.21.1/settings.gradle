pluginManagement {
    repositories {
        // Plugin Portal (plugins.gradle.org) is unreachable in this environment.
        // NeoForge's Gradle plugins publish their markers to maven.neoforged.net, so resolve from there.
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'Pigthings-1.21.1-NeoForge'
